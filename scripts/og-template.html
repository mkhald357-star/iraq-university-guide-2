<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px;
    font-family:'Cairo','Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(135deg,#0D9488 0%,#134E4A 100%);
    color:#fff; display:flex; flex-direction:column;
    justify-content:center; padding:80px; position:relative; overflow:hidden;
  }
  /* transform لا top/left سالبة عمداً -- القيم السالبة تُوسِّع scrollWidth
     فعلياً حتى مع overflow:hidden، فتُزيح منطقة التقاط الصورة (اكتُشف فعلياً
     أثناء بناء هذا القالب -- راجع data/admission_rules.md §33). transform
     بصري بحت، لا يؤثر على تخطيط الصفحة أو نطاق اللقطة. خصائص فيزيائية
     (left/top/right/bottom) لا منطقية عمداً -- عنصر زخرفي لا يحتاج مرآة RTL. */
  .orb { position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; }
  .o1 { width:420px; height:420px; background:#2DD4BF; left:0; top:0; transform:translate(-80px,-120px); }
  .o2 { width:520px; height:520px; background:#0F766E; right:0; bottom:0; transform:translate(120px,180px); }
  .badge { display:inline-flex; align-items:center; gap:12px; align-self:flex-start;
           border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.10);
           border-radius:999px; padding:10px 22px; font-size:24px; font-weight:700; }
  .dot { width:12px; height:12px; border-radius:50%; background:#5EEAD4; }
  h1 { font-size:76px; font-weight:900; line-height:1.25; margin-top:34px;
       max-width:900px; min-width:0; align-self:flex-start; text-align:right; }
  p  { font-size:32px; font-weight:400; opacity:.88; margin-top:24px; line-height:1.6;
       max-width:820px; min-width:0; align-self:flex-start; text-align:right; }
  .stats { display:flex; gap:56px; margin-top:52px; align-self:flex-start; }
  .n { font-size:52px; font-weight:900; }
  .l { font-size:22px; opacity:.75; margin-top:6px; }
</style>
</head>
<body>
  <span class="orb o1"></span><span class="orb o2"></span>
  <span class="badge"><span class="dot"></span>بيانات رسمية من وزارة التعليم العالي</span>
  <h1 id="title"></h1>
  <p id="desc"></p>
  <div class="stats" id="stats"></div>
</body>
</html>
