name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate data
        run: npm run validate-data

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser (for a11y-check)
        run: npx playwright install --with-deps chromium

      # تقرير فقط، لا حاجب -- لا خط أساس تاريخي لعدد المخالفات بعد (§39). يمكن
      # تشديده لاحقاً إلى حاجب صارم فور معرفة الخط الأساسي الفعلي من التشغيلات
      # الأولى على CI (البيئة المحلية نظيفة تماماً حالياً: 0 critical/serious
      # عبر كل الصفحات العشر، لكن CI بيئة مختلفة قد تُظهر نتائج مختلفة).
      - name: Accessibility check (report only, non-blocking)
        run: npm run a11y-check
        continue-on-error: true
