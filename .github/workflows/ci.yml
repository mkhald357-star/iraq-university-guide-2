name: CI

on:
  push:
  pull_request:

# أقل صلاحية (SECURITY-PLAN.md س1-5): القراءة فقط، فلا يستطيع أي خطوة مخترَقة الكتابة على المستودع.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # الإجراءات مثبَّتة بـSHA لا بوسم متحرك (الوسم يمكن نقله لكود آخر). الوسم في التعليق للقراءة فقط.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # تاريخ كامل لفحص الأسرار في كل الـcommits
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # فحص الأسرار في كل التاريخ. ثنائي رسمي بإصدار ثابت ويُرفَض إن لم يطابق مجموعه المنشور.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
          rm -f gitleaks gitleaks.tgz

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ثغرات الاعتماديات التي تصل للموقع المنشور: حاجب عند high فما فوق.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate data
        run: npm run validate-data

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # البناء يشغّل postbuild: يُفشل إن وُجدت خرائط مصدر أو سكربت خارجي أو قيمة نائبة،
      # ويولّد _headers (CSP بالهاشات) وintegrity.json.
      - name: Build (with output security checks)
        run: npm run build

      - name: Verify security headers were generated
        run: |
          test -s out/_headers
          grep -q "Content-Security-Policy" out/_headers
          grep -q "Strict-Transport-Security" out/_headers
          test -s out/integrity.json
          test -s out/.well-known/security.txt

      - name: Install Playwright browser (for a11y-check)
        run: npx playwright install --with-deps chromium

      # تقرير فقط، لا حاجب -- لا خط أساس تاريخي لعدد المخالفات بعد (§39). يمكن
      # تشديده لاحقاً إلى حاجب صارم فور معرفة الخط الأساسي الفعلي من التشغيلات
      # الأولى على CI (البيئة المحلية نظيفة تماماً حالياً: 0 critical/serious
      # عبر كل الصفحات العشر، لكن CI بيئة مختلفة قد تُظهر نتائج مختلفة).
      - name: Accessibility check (report only, non-blocking)
        run: npm run a11y-check
        continue-on-error: true
